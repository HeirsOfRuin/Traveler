# The prologue: the shed, and the one hand's worth. From docs/GATE-A.md (fourth draft), section 1.
# Varies by occupation (what the hero looks at first). The choice is the kit: three ways to be a
# stranger. Every road goes through the door; none is a refusal.

- id: p_shed
  chapter: prologue
  checkpoint: true
  title: The shed
  text: |
    Your uncle Walter does not trust telephones, so the news comes by post, on one page, in block capitals pressed hard enough to read from the back.

    GOT IT WORKING. COME SATURDAY. BRING WHAT YOU USE AT WORK. DO NOT TELL YOUR MOTHER.

    He has ended every letter that way since you were nine, including the Christmas cards, which he addresses to her. He did not say which Saturday. You let that carry you past the first one, and it is the second when you go.

    It is two hours of gravel to his place. The yard light is on at noon and his truck is in the yard with the flat you mentioned in April, when he said he was aware of it. The shed door is rolled open a foot for the cat.

    Inside, the heater is running for nobody. There is a cup of coffee on the bench with a skin on it, and the radio is on low, where a man is reading out the price of canola.
    [break]
    Bolted to the slab in the middle of the floor is a door frame, with no door in it and no wall around it. It is seven feet of two-inch square tube, and cables as thick as your wrist run from it to a rack of equipment you cannot name, apart from one item, which is the arc welder that went missing from your mother's garage four years ago. He was very decent about it at the time.

    [if occupation == welder]You look at the welds first, because you always do. You gave him a summer of lessons once and he gave it back. He has ground every joint flat and painted it, and you know from experience what a person is hiding when they go to that trouble on a frame nobody will see. Whatever this one does, it does on the strength of those.[elif occupation == nurse]You look at the bench first, because eleven years have taught you to find the mess before you look at the patient. There is a roll of gauze with its wrapper torn open by teeth, a bottle of the brown antiseptic nobody has stocked since you trained, and a tea towel that will not be used for tea again. Whatever he cut, he dressed it one-handed and in a hurry, and about as well as he does most things.[elif occupation == teacher]You look at the shelf first, because you read people's shelves. There is the Old Norse grammar you lent him two Christmases ago and wrote off, with its spine broken at the verbs. Next to it are a road atlas of Italy and a paperback history of Japan with a bus ticket a third of the way in. He has never been known to finish a book, and you would have said he had never been known to start three.[else]You look at the supply first, because somebody ought to. The cables run back to the panel by the door, where he has pulled the breaker for the grain dryer and fitted something of his own made out of copper bar. There is a scorch on the wall above it in the shape of a hand. Nothing in this building is rated for whatever goes through that frame, and the building has plainly told him so.[/if]

    Under a wrench on the bench is half a sheet of paper.

    Gone through. Back for supper. If I am not, DO NOT FOLLOW. W.

    He has underlined NOT twice. Beside the W is a thumbprint in something brown, which has dried as blood dries and coffee does not.
    [break]
    Beside the note is a foam-lined case cut for two of something. One place is empty. In the other is a brass object about the size of a hearing aid, with a hook to sit behind the ear, and a strip of masking tape on the lid reads EAR. MOSTLY WORKS. The truck has a label like that on the dash.

    Through the frame you can see the back wall of the shed, the pegboard and the co-op calendar, all where they belong. The air inside it is a little darker than the air outside it, though, as it is in any doorway, and a draught is coming through that smells of woodsmoke and low tide. The nearest tide is three days' drive from here.

    The cat has taken the far wall, and from the state of the blanket it has had the far wall for some time.

    There is more tape on the frame itself, at eye height. ONE HAND'S WORTH. ASK ME HOW I KNOW.

    So you are going, it seems, and the question is what the hand is for. Your work bag is in the truck, since he asked for it. His notebook is on the bench beside the note, a black one gone fat with use, with a rubber band round it. And over the kettle is a shelf he has labelled TRADE, which holds a bag of sugar, a tin of pepper and three cards of steel needles from the fabric shop in town. You had taken that for groceries and a hobby.
  choices:
    - id: bag
      text: Fetch your work bag from the truck.
      effects: [ { take: bag } ]
      text_after: |
        The bag is on the passenger seat, under a coat, where it spends its weekends.

        You hook the brass thing behind your ear and find it warm, as if it had lately been behind somebody else's. The note goes into your jacket, since a person should have something to show the police. Your phone and your lighter are in your pockets already, where they live.

        You step through the frame as you would over a garden hose, without looking down, with your one hand's worth.
      next: n_hill
    - id: notebook
      text: Take his notebook.
      effects: [ { take: notebook }, { add: { counter.talk: 1 } } ]
      text_after: |
        The notebook is heavier than it looks, and it smells of his truck.

        You hook the brass thing behind your ear and find it warm, as if it had lately been behind somebody else's. The note goes into your jacket, since a person should have something to show the police. Your phone and your lighter are in your pockets already, where they live.

        You step through the frame as you would over a garden hose, without looking down, with your one hand's worth.
      next: n_hill
    - id: sack
      text: Empty the TRADE shelf into a feed sack.
      effects: [ { take: sack }, { add: { counter.place: 1 } } ]
      text_after: |
        The sugar, the pepper and the needles go into a feed sack from the pile by the door. They leave a good deal of sack.

        You hook the brass thing behind your ear and find it warm, as if it had lately been behind somebody else's. The note goes into your jacket, since a person should have something to show the police. Your phone and your lighter are in your pockets already, where they live.

        You step through the frame as you would over a garden hose, without looking down, with your one hand's worth.
      next: n_hill
