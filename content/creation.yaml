# Who the player makes before the story starts (docs/FRAME-creation.md).
# Every word on the creation screen is here; the rules are in src/game/creation.ts.
# The kit (tool bag, notebook, sack) is NOT here: it is the story's first choice, in the shed.
title: Who went through the door
lede: Your uncle wrote to you, and not to anybody else. He will have had a reason.
name:
  prompt: Your name
  default: Sam                 # used when the box is left empty, and shown in it
  max: 24
sex:
  prompt: You are
  options:
    male: A man
    female: A woman
  owed: Say whether you are a man or a woman.
courts:
  prompt: And if you were to lose your head over somebody
  note: Two people in each era can be courted. Nobody has to be.
  options:
    women: It would be a woman
    men: It would be a man
  owed: Say who it would be.
# The groups, in the order shown. Every option is an id in registry/traits.yaml, and no id is in
# two groups. A group that picks one swaps when another is tapped; a group that picks more refuses
# the extra one and says so. Content reads any of them as trait.<id>, and a pick-one group also as
# <group> == <id> (occupation == nurse).
groups:
  - id: occupation
    prompt: What you do for a living
    pick: 1
    options: [welder, nurse, teacher, engineer]
    owed: Say what you do for a living.
  - id: traits
    prompt: Two things about you that have never once been useful
    pick: 2
    options: [rider, charm, martial, fencer, speaker, hunter, sailor, farm]
    owed: "Choose {n} more."
    full: Two only. Put one back first.
  - id: looks
    prompt: To look at, you are
    note: This and the next change how you are written about more than what happens to you.
    pick: 1
    options: [tall, slight, broad, forgettable]
    owed: Say what you look like.
  - id: manner
    prompt: To deal with, you are
    pick: 1
    options: [blunt, quiet, cheerful, stubborn]
    owed: Say what you are like.
begin: Open the letter
name_long: That name is too long for the envelope.
