# Continuity rules: npm run continuity (tools/narrative/continuity.ts, from the game-narrative skill).
# Each rule: a phrase the prose may only use while a condition holds in the run showing it.
rules:
  - match: "The bag is under your head"
    allow: kit == bag
    why: Only a hero who fetched the work bag has one.
  - match: "the notebook|The notebook"
    allow: kit == notebook
    why: The notebook stayed on the bench unless it was the one thing carried.
  - match: "the sack|The sack"
    allow: kit == sack
  - match: "door in (the|his) throat"
    allow: road.first == explain
    why: Only a hero who explained the smith's throat has said it.
dead_names_ok: {}
memorial: []
