# The game's fixed lists. Every id here is checked against the content by the validator.
#
# The story engine was built for a knight's career under a king. This game uses its scenes,
# conditions, effects, text and saves, and leaves the rest idle (docs/DESIGN.md section 3):
#  - the date line is the era's (content/eras.yaml), so start_year and regnal_king are never shown;
#  - there are no checks yet, so one attribute and one skill stand in for the lists the schema needs;
#  - one station: the hero is a stranger. The ladder of each era is this game's own, not designed yet.
title: "Traveler"
start_year: 870
regnal_king: nobody
reigns: []
attributes: [wits]
skills: [craft]
stations: [stranger]
tracks: [visit]
seasons: [spring, summer, autumn, winter]
chapters: [prologue, norway]
counter_labels:
  place: "Your place in the hall"
  talk: "Talk about you"
aliases: []
chapter_cards:
  prologue: { title: "Now", subtitle: "A machine shed, two hours of gravel from town" }
  norway: { title: "Norway", subtitle: "A fjord in the west, about the year 870" }
